name: Release monster_panel
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Existing Git tag to build and publish without moving the tag
        required: true
        default: v1.2.0
permissions:
  contents: read
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      IMAGE: ghcr.io/taozi-succes/monster_panel
      RELEASE_TAG: ${{ inputs.version || github.ref_name }}
      NODE_IMAGE: gozargah/marzban-node@sha256:f93791ee35aa98b3851b74e5556c33a1d4607caf3e10781f52f37add14ed974d
      PANEL_IMAGE: gozargah/marzban@sha256:8e422c21997e5d2e3fa231eeff73c0a19193c20fc02fa4958e9368abb9623b8d
      NGINX_IMAGE: nginx@sha256:901e593c95dc85f5a729f5765516321366ef4ac401821431d408897e95287d0a
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || github.ref }}
      - name: Check public destination
        env:
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          test "$PRIVATE" = false && test "$GITHUB_REPOSITORY" = Taozi-succes/monster_panel
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git describe --tags --exact-match)" = "$RELEASE_TAG"
          bash -n install.sh migrate.sh node.sh deploy/node/install.sh
          (cd deploy/operations && sha256sum --check --strict SHA256SUMS)
          (cd deploy/node && sha256sum --check --strict SHA256SUMS)
      - name: Build a single platform release
        run: docker build --platform linux/amd64 --provenance=false --sbom=false --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" -t "$IMAGE:$RELEASE_TAG" .
      - name: Run permission and operations tests
        run: |
          docker run --rm --network none -e PYTHONPATH=/code -v "$PWD/tests:/checks:ro" --entrypoint python "$IMAGE:$RELEASE_TAG" /checks/test_inbound_assignments.py
          docker run --rm --network none -v "$PWD:/repo:ro" -w /repo --entrypoint python "$IMAGE:$RELEASE_TAG" -m unittest discover -s tests/operations -v
          python3 tests/operations/integration.py --image "$IMAGE:$RELEASE_TAG"
      - name: Test SSH migration wizard
        run: |
          docker build --build-arg PANEL_IMAGE="$IMAGE:$RELEASE_TAG" -t marzban-panel-ssh:test -f tests/operations/Dockerfile.ssh .
          docker run --rm --network none -v "$PWD:/repo:ro" --entrypoint python marzban-panel-ssh:test /repo/tests/operations/ssh_integration.py
      - name: Test node installer before publication
        run: |
          docker pull "$NODE_IMAGE"
          docker pull "$PANEL_IMAGE"
          docker pull "$NGINX_IMAGE"
          docker run --rm --network none -v "$PWD:/repo:ro" -w /repo --entrypoint python "$NODE_IMAGE" -m unittest discover -s tests/node -v
          python3 tests/node/integration.py
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push verified version
        run: docker push --platform linux/amd64 "$IMAGE:$RELEASE_TAG"
