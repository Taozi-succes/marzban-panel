name: Release public panel image
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      IMAGE: ghcr.io/taozi-succes/marzban-panel
    steps:
      - uses: actions/checkout@v4
      - name: Check public destination
        env:
          PRIVATE: ${{ github.event.repository.private }}
        run: test "$PRIVATE" = false && test "$GITHUB_REPOSITORY" = Taozi-succes/marzban-panel
      - run: docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$IMAGE:$GITHUB_REF_NAME" .
      - name: Run permission and operations tests
        run: |
          docker run --rm --network none -e PYTHONPATH=/code -v "$PWD/tests:/checks:ro" --entrypoint python "$IMAGE:$GITHUB_REF_NAME" /checks/test_inbound_assignments.py
          docker run --rm --network none -v "$PWD:/repo:ro" -w /repo --entrypoint python "$IMAGE:$GITHUB_REF_NAME" -m unittest discover -s tests/operations -v
          python3 tests/operations/integration.py --image "$IMAGE:$GITHUB_REF_NAME"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push verified version
        run: docker push "$IMAGE:$GITHUB_REF_NAME"
